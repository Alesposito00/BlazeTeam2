    <script>
      (function () {
        try {
          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var proto = typeof Window !== 'undefined' ? Window.prototype : null;
          var protoDesc = !winDesc && proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : null;
          var activeDesc = winDesc || protoDesc;
          if (activeDesc && activeDesc.get && !activeDesc.set && (!winDesc || winDesc.configurable)) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (e) {}

        try {
          window.addEventListener(
            'error',
            function (ev) {
              var src = (ev && ev.filename) || '';
              var msg = (ev && ev.message) || '';
              var stack = (ev && ev.error && ev.error.stack) || '';
              if (
                src.indexOf('chrome-extension://') === 0 ||
                stack.indexOf('chrome-extension://') !== -1 ||
                msg.indexOf('Cannot set property fetch of #<Window>') !== -1
              ) {
                ev.preventDefault();
                ev.stopImmediatePropagation();
              }
            },
            true
          );
        } catch (e) {}
      })();
    </script>
